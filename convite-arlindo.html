<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite do Arlindo 2025</title>
</head>

<style>
    body {
        display: flex;
        justify-content: center;
        margin: 0;
        font-family: sans-serif;
    }

    #background {
        position: absolute;
        width: 100%;
        height: auto;
        z-index: 0;
    }

    #overlay {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        z-index: 1;
    }

    #location,
    #whatsapp,
    #wrapper {
        position: absolute;
        text-decoration: none;
    }

    #wrapper {
        display: flex;
        justify-content: center;
    }

    #counter {
        color: white;
        font-weight: bold;
        display: flex;
        margin: 0;
    }

    p {
        margin: 0;
        white-space: pre;
    }

    #days,
    #hours,
    #mins,
    #secs {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .confetti-container {
        position: absolute;
        pointer-events: none;
        z-index: 2;
        overflow: hidden;
    }

    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        opacity: 1;
    }

    @keyframes explode {
        to {
            transform: translate(var(--dx), var(--dy)) rotate(720deg);
            opacity: 0;
        }
    }

    @keyframes fall {
        0% {
            transform: translateY(0);
            opacity: 1;
        }

        100% {
            transform: translateY(100vh);
            opacity: 0;
        }
    }

    @media (min-width: 768px) {
        #background {
            height: 100vh;
            width: auto;
            left: auto;
        }
    }
</style>

<body>
    <img id="background"
        src="https://raw.githubusercontent.com/arimateia286/DeusiCalc/refs/heads/gh-pages/assets/img/favicons/convite-arlindo.png">
    <div id="overlay">
        <a id="location" href="https://maps.app.goo.gl/2vpCWDXVmmqfY1CL9"></a>
        <a id="whatsapp"
            href="https://api.whatsapp.com/send?phone=5585974010677&text=Oi%2C%20Arlindo!%20Estou%20confirmando%20minha%20presen%C3%A7a%20em%20seu%20anivers%C3%A1rio!%20%F0%9F%A5%B3%F0%9F%A5%B3%F0%9F%A5%B3"></a>
        <div id="wrapper">
            <div id="counter">
                <div id="days">
                    <p id="daysCounter"></p>
                    <p id="daysLabel" class="text">DIAS</p>
                </div>
                <p> </p>
                <div id="hours">
                    <p id="hoursCounter"></p>
                    <p id="hoursLabel" class="text">HRS</p>
                </div>:
                <div id="mins">
                    <p id="minsCounter"></p>
                    <p id="minsLabel" class="text">MINS</p>
                </div>:
                <div id="secs">
                    <p id="secsCounter"></p>
                    <p id="secsLabel" class="text">SEGS</p>
                </div>
            </div>
        </div>
    </div>
    <div class="confetti-container" id="confetti-container"></div>
</body>

<script>
    window.onload = () => {
        const get = (id) => document.getElementById(id);

        const numero = "5585991902218";

        const background = get("background");
        const backWidth = background.getBoundingClientRect().width;
        const backHeight = background.getBoundingClientRect().height;

        const overlay = get("overlay");
        overlay.style.width = `${backWidth}px`;
        overlay.style.height = `${backHeight}px`;

        const container = get("confetti-container");
        container.style.width = `${backWidth}px`;
        container.style.height = `${backHeight}px`;

        const move = (id, y, w, h) => {
            const element = get(id);
            const rect = {
                y: `${y / 100 * backHeight}px`,
                w: `${w / 100 * backWidth}px`,
                h: `${h / 100 * backHeight}px`
            };
            element.style.top = rect.y;
            element.style.width = w === "auto" ? "auto" : rect.w;
            element.style.height = h === "auto" ? "auto" : rect.h;
        };

        move("location", 78.5, 75, 6);
        move("whatsapp", 89, 35, 8.5);
        move("wrapper", 54.5, 72, "auto");

        const updateCounter = () => {
            const targetDate = new Date("2025-05-31T19:00:00");
            const now = new Date();
            const difference = targetDate - now;

            if (difference <= 0) {
                get("counter").innerHTML = `Tempo Esgotado<p class="text">Quem foi, foi, quem não foi, não vai mais</p>`;
                get("counter").style.flexDirection = "column";
                if (intervalo) clearInterval(intervalo);
                return;
            }

            const seconds = Math.floor((difference / 1000) % 60);
            const minutes = Math.floor((difference / (1000 * 60)) % 60);
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));

            get("daysCounter").textContent = String(days).padStart(2, "0");
            get("hoursCounter").textContent = String(hours).padStart(2, "0");
            get("minsCounter").textContent = String(minutes).padStart(2, "0");
            get("secsCounter").textContent = String(seconds).padStart(2, "0");
        };

        let intervalo = setInterval(updateCounter, 1000);
        updateCounter();

        const wrapper = get("wrapper");
        const counter = get("counter");
        const labels = [
            get("daysLabel"),
            get("hoursLabel"),
            get("minsLabel"),
            get("secsLabel")
        ];

        let fontSize = 1;
        let labelFontSize = 1;

        counter.style.fontSize = `${fontSize}px`;

        while (counter.getBoundingClientRect().width < wrapper.getBoundingClientRect().width) {
            fontSize++;
            labelFontSize = fontSize * 0.4;
            labels.forEach(label => {
                label.style.fontSize = `${labelFontSize}px`;
            });
            counter.style.fontSize = `${fontSize}px`;
        }

        if (counter.getBoundingClientRect().width > wrapper.getBoundingClientRect().width) {
            fontSize--;
            labelFontSize = fontSize * 0.4;
            labels.forEach(label => {
                label.style.fontSize = `${labelFontSize}px`;
            });
            counter.style.fontSize = `${fontSize}px`;
        }

        const colours = ["#00aaff", "#ff66cc"];

        const confettiExplosion = (qtd = 250) => {
            for (let i = 0; i < qtd; i++) {
                const confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.style.backgroundColor = colours[Math.floor(Math.random() * colours.length)];
                confetti.style.left = "50%";
                confetti.style.top = "50%";
                confetti.style.transform = "translate(-50%, -50%)";

                const angle = Math.random() * 2 * Math.PI;
                const distance = 100 + Math.random() * 200;
                const dx = `${Math.cos(angle) * distance}px`;
                const dy = `${Math.sin(angle) * distance}px`;

                confetti.style.setProperty("--dx", dx);
                confetti.style.setProperty("--dy", dy);
                confetti.style.animation = `explode 1s ease-out forwards`;

                container.appendChild(confetti);
                setTimeout(() => confetti.remove(), 1200);
            }
        };

        const createFallingConfetti = () => {
            const confetti = document.createElement("div");
            confetti.className = "confetti";
            confetti.style.left = `${Math.random() * window.innerWidth}px`;
            confetti.style.top = "-10px";
            confetti.style.backgroundColor = colours[Math.floor(Math.random() * colours.length)];
            confetti.style.animation = `fall ${2 + Math.random() * 3}s linear forwards`;

            container.appendChild(confetti);
            setTimeout(() => confetti.remove(), 5000);
        };

        confettiExplosion();

        setTimeout(() => {
            const intervalo = setInterval(createFallingConfetti, 50);
            setTimeout(() => clearInterval(intervalo), 5000);
        }, 1000);
    };
</script>

</html>
